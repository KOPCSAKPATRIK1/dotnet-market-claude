name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify invariants (I1–I6)
        env:
          KIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: node tools/kit.mjs verify

      - name: Idempotence (I7) – a second sync writes nothing
        run: |
          node tools/kit.mjs sync
          git diff --exit-code
